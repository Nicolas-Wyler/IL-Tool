<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IL Tool">
  <title>IL Tool</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header class="app-brand">
      <div class="brand-label"><button id="open-settings" class="brand-icon" type="button" aria-label="Settings" title="Settings"><img src="./icon-192.png" width="192" height="192" alt=""></button><span class="brand-name">IL Tool</span></div>
      <div class="project-title"><button id="project-title" type="button" title="Rename project">Untitled</button><input id="project-name" type="text" value="Untitled" aria-label="Project name" autocomplete="off" hidden></div>
      <div class="file-controls"><button id="undo" class="icon-button" type="button" aria-label="Undo" title="Undo" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 3 11l6 6M3 11h10a7 7 0 0 1 7 7"/></svg></button><button id="redo" class="icon-button" type="button" aria-label="Redo" title="Redo" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 6 6-6 6M21 11H11a7 7 0 0 0-7 7"/></svg></button><button id="refresh" class="icon-button" type="button" aria-label="Refresh" title="Refresh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button><button id="update" type="button" hidden>Update</button><button id="export" type="button">Export</button><button id="save" type="button">Save</button><button id="load" type="button">Load</button><input id="load-file" type="file" accept=".iltool,.json,application/json" hidden></div>
    </header>
    <form id="parameters" autocomplete="off">
    <div class="master-controls unified-master">
      <label for="wavelength"><span class="header-full">Wavelength λ (nm)</span><span class="header-compact" hidden>λ (nm)</span><input id="wavelength" name="wavelength" type="number" value="3.1" min="0" step="any" required></label>
      <label for="working-distance"><span class="header-full">Working distance g (µm)</span><span class="header-compact" hidden>g (µm)</span><input id="working-distance" name="workingDistance" type="number" value="2000" min="0" step="any" required></label>
      <label for="grating-width"><span class="header-full">Grating width d<sub>g</sub> (µm)</span><span class="header-compact" hidden>d<sub>g</sub> (µm)</span><input id="grating-width" name="gratingWidth" type="number" value="80" min="0" step="any" required></label>
    <div class="edit-mode"><span>θ / φ₀</span><button id="edit-mode" type="button" role="switch" aria-label="Edit pitch instead of theta and phase" aria-checked="false"><span></span></button><span>P<sub>g</sub></span></div>
    </div>
    <div class="table-scroll"><table class="parameter-table unified-table" id="wave-table" role="grid" aria-label="Waves and gratings"><colgroup><col style="width:38px"><col><col><col><col><col><col><col style="width:42px"></colgroup><thead><tr><th class="color-column" aria-label="Color"></th><th scope="col" title="Diffraction Angle"><span class="header-full">Diffraction Angle θ (°)</span><span class="header-compact" hidden>θ (°)</span></th><th scope="col" title="Initial Phase"><span class="header-full">Initial Phase φ₀ (°)</span><span class="header-compact" hidden>φ₀ (°)</span></th><th scope="col" title="Grating Pitch"><span class="header-full">Grating Pitch P<sub>g</sub> (nm)</span><span class="header-compact" hidden>P<sub>g</sub> (nm)</span></th><th scope="col" title="Efficiency"><span class="header-full">Efficiency η</span><span class="header-compact" hidden>η</span></th><th scope="col" title="Azimuth"><span class="header-full">Azimuth α (°)</span><span class="header-compact" hidden>α (°)</span></th><th scope="col" title="Distance from Center"><span class="header-full">Distance from Center r (µm)</span><span class="header-compact" hidden>r (µm)</span></th><th class="remove-column" aria-label="Remove"></th></tr></thead><tbody id="waves"><tr class="wave-row" aria-label="Row 1"><td class="color-cell"><input class="row-color" type="color" value="#67c5ff" aria-label="Grating color"></td><td><label for="theta"><span class="field-label">θ (°)</span><input id="theta" name="theta" type="number" value="30" min="-90" max="90" step="any" required></label></td><td><label for="phase"><span class="field-label">Initial phase (°)</span><input id="phase" name="phase" type="number" value="0"  step="any" required></label></td><td><label for="pitch"><span class="field-label">Grating pitch (nm)</span><input id="pitch" name="pitch" type="number" value="27" min="0" step="any" required></label></td><td><label for="efficiency"><span class="field-label">Efficiency</span><input id="efficiency" name="efficiency" type="number" value="1" min="0" max="1" step="any" required></label></td><td><label for="azimuth"><span class="field-label">Azimuth α (°)</span><input id="azimuth" name="azimuth" type="number" value="0"  step="any" required></label></td><td><label for="radius"><span class="field-label">Distance from center (µm)</span><input id="radius" name="radius" type="number" min="0" step="any" readonly data-derived="true"></label></td><td class="remove-cell"><button class="tray-button" type="button" aria-label="Remove row 1" data-remove-row><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button></td></tr></tbody></table></div>
</form>
    <div class="plot-controls-bar"><div class="table-actions"><button id="select-rows" type="button" aria-pressed="false">Select</button><button id="add" class="add-button" type="button">Add</button><button id="copy-rows" type="button" hidden disabled>Copy</button><button id="paste-rows" type="button" hidden disabled>Paste</button><button id="duplicate-rows" type="button" hidden disabled>Duplicate</button><button id="delete-rows" type="button" hidden disabled>Delete</button></div>    <div class="view-controls">
      <select id="view" aria-label="Field view">
        <option value="complex">Complex field</option>
        <option value="intensity">|Ẽ|²</option>
        <option value="phase">Phase</option>
        <option value="realSquared">[Re(Ẽ)]²</option>
      </select>
      <div class="speed-controls" role="group" aria-label="Playback speed">
        <button id="slower" type="button" aria-label="Slow down playback" title="Slower (½×)">−</button>
        <button id="faster" type="button" aria-label="Speed up playback" title="Faster (2×)">+</button>
      </div>
      <button id="play" type="button" aria-pressed="false">Run</button>
    </div>
</div>
    <div class="plots">
    <section class="grating-section" aria-label="Grating controls">
      <figure aria-label="Grating layout">
        <div class="plot">
          <div class="placeholder-square" role="img" aria-label="Grating layout with a center cross"><span class="center-cross" aria-hidden="true"></span></div>
        </div>
      </figure>
    </section>
    <section class="field-section" aria-label="Interference">
    <figure aria-label="Field on the observation plane">
      <div class="plot">
        <div class="field-surface"><canvas id="field" width="640" height="640" role="img" aria-label="Complex field heatmap"></canvas>      <div class="legends">
        <div class="legend" id="brightness-legend">
          <div class="ramp"></div>
          <div class="ends"><span>0</span><span id="intensity-label">|Ẽ|² (a.u.)</span><span id="intensity-max">1</span></div>
        </div>
        <div class="legend" id="phase-legend">
          <div class="ramp phase"></div>
          <div class="ends"><span>−π</span><span>Phase</span><span>π</span></div>
        </div>
      </div>
</div>
      </div>
    </figure>
    </section>
    </div>
  </main>
  <dialog id="app-settings" aria-labelledby="settings-name">
    <button id="close-settings" class="settings-close" type="button" aria-label="Close settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <h1 id="settings-name">IL Tool</h1>
    <p id="app-version"></p>
    <p>© 2026 Nicolas Wyler</p>
    <a class="github-link" href="https://github.com/Nicolas-Wyler/IL-Tool" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository" title="GitHub"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.82c.56.1.77-.24.77-.54v-2.09c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.15 1.72 1.15 1 1.72 2.62 1.22 3.26.94.1-.73.4-1.22.71-1.5-2.5-.29-5.13-1.25-5.13-5.54 0-1.23.44-2.24 1.15-3.03-.12-.28-.5-1.43.11-2.98 0 0 .94-.3 3.08 1.15a10.8 10.8 0 0 1 5.62 0c2.14-1.45 3.08-1.15 3.08-1.15.61 1.55.23 2.7.11 2.98.72.79 1.15 1.8 1.15 3.03 0 4.3-2.64 5.25-5.15 5.53.41.35.76 1.03.76 2.08v3.1c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z"/></svg></a>
    <label for="export-resolution">Export resolution<input id="export-resolution" type="number" value="640" min="1" max="4096" step="1" required></label>
  </dialog>
  <script src="./dev-watch.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
